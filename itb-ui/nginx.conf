# Preserve ITB's policy, including connect-src 'self'. Allow only same-origin
# frames for the sandboxed srcdoc preview; keep frame-ancestors 'none'.
map $upstream_http_content_security_policy $itb_preview_policy {
    "" "";
    default "$upstream_http_content_security_policy frame-src 'self';";
}
map $http_upgrade $itb_connection {
    default upgrade;
    "" close;
}
# Caddy sets this header itself. HTTPS deployments bind the gateway's host port
# to loopback; direct HTTP development requests retain their original scheme.
map $http_x_forwarded_proto $itb_forwarded_proto {
    default $scheme;
    https https;
}

server {
    listen 9000;
    # ITB's REST automation API authenticates with the ITB_API_KEY header.
    underscores_in_headers on;
    # Follow container recreation without requiring a gateway restart.
    resolver 127.0.0.11 valid=30s ipv6=off;
    client_max_body_size 0; # Preserve ITB's own upload limits.

    location = /itb-extension/provenance.json {
        alias /usr/share/nginx/itb-extension/provenance.json;
        add_header Cache-Control "no-cache" always;
    }

    # Serve only the compiled frontend; ITB still owns all other assets and APIs.
    location ^~ /assets/build/ {
        alias /usr/share/nginx/itb-assets/;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /cda-preview {
        limit_except POST { deny all; }
        client_max_body_size 10m;
        client_body_buffer_size 10m;
        access_log off;
        set $renderer http://cda-validator:8080;
        proxy_pass $renderer/cda-dk/preview;
        proxy_set_header Host $proxy_host;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_set_header ITB_API_KEY "";
        proxy_set_header Origin "";
        proxy_set_header Referer "";
        proxy_read_timeout 65s;
        proxy_redirect off;
    }

    location / {
        set $itb http://gitb-ui:9000;
        proxy_pass $itb$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $itb_connection;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $itb_forwarded_proto;
        proxy_hide_header Content-Security-Policy;
        add_header Content-Security-Policy $itb_preview_policy always;
        proxy_read_timeout 300s;
        proxy_buffering off;
        proxy_redirect off;
    }
}
