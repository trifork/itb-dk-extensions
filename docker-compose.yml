volumes:
  gitb-repo:
  gitb-dbdata:

services:
  # Session cache used by the ITB user interface.
  gitb-redis:
    image: isaitb/gitb-redis:1.30.2@sha256:a507e0d78b97f1def4227614d83bc5b02c57802373a7871e264de0e0e4a68777
    container_name: itb-redis
    restart: unless-stopped

  # ITB persistence. The image supplies development-friendly default credentials.
  gitb-mysql:
    image: isaitb/gitb-mysql:1.30.2@sha256:f8a72f290077833f283daa4b52dd74a9a211da41b87e0521625b7b174cc58a02
    container_name: itb-mysql
    restart: unless-stopped
    volumes:
      - gitb-dbdata:/var/lib/mysql
    healthcheck:
      test: '/usr/bin/mysql --user=root --password=$$MYSQL_ROOT_PASSWORD --execute "SHOW DATABASES;"'
      interval: 3s
      retries: 50

  # GITB test execution engine and callback endpoint.
  gitb-srv:
    image: isaitb/gitb-srv:1.30.2@sha256:ef75168433f1fae53f663679cd3b0e61d65701a15515c66473dbfd2bb26dc238
    container_name: itb-srv
    restart: unless-stopped
    environment:
      CALLBACK_ROOT_URL: http://localhost:8080/itbsrv
    ports:
      - "8080:8080"

  # ITB management and test execution UI.
  gitb-ui:
    image: &itb_ui_image isaitb/gitb-ui:1.30.2@sha256:e7f017dd83d142d56f0b2d8acd729f1a14bbe5bcb2bdfa2f8f4759b42866b8d9
    container_name: itb-ui
    restart: unless-stopped
    environment:
      THEME: ec
      # Enable REST automation and, on first database initialisation, use the
      # master key generated by get-up-and-running/start.sh.
      AUTOMATION_API_ENABLED: "true"
      AUTOMATION_API_MASTER_KEY: ${ITB_AUTOMATION_API_MASTER_KEY:-}
    volumes:
      - gitb-repo:/gitb-repository
    depends_on:
      gitb-redis:
        condition: service_started
      gitb-mysql:
        condition: service_healthy
      gitb-srv:
        condition: service_started

  # Same-origin CDA preview route and the unchanged ITB UI behind one address.
  gitb-ui-gateway:
    image: itb-dk-ui:local
    build:
      context: ./itb-ui
      target: runtime
      args:
        ITB_UI_IMAGE: *itb_ui_image
    restart: unless-stopped
    ports:
      - "9000:9000"
    depends_on:
      gitb-ui:
        condition: service_started
      cda-validator:
        condition: service_started

  # Danish CDA validation service. From a TDL test case, use the internal URL
  # http://cda-validator:8080/api/cda-dk/validation?wsdl.
  cda-validator:
    image: itb-dk-cda:local
    build:
      context: ./cda-validator
      target: runtime
      args:
        CDA_VALIDATOR_IMAGE: isaitb/xml-validator:1.13.1@sha256:436a1fcfcb2f0a429b5fac02a0cc56bc1c23ea926d68b1a45da5ea2a9e3c6a90
    container_name: cda-dk-validator
    restart: unless-stopped
    ports:
      - "8091:8080"

  # Optional DDS search/retrieval. No XDS service publishes a host port.
  xds-api:
    image: itb-dk-xds:local
    build:
      context: ./xds-service
      target: runtime
    user: "${XDS_LOCAL_USER:-65532:65532}"
    profiles: [xds]
    restart: unless-stopped
    environment:
      XDS_STS_URL: ${XDS_STS_URL:-http://test1.ekstern-test.nspop.dk:8080/sts/services/NewSecurityTokenService}
      XDS_REGISTRY_URL: ${XDS_REGISTRY_URL:-http://test1-cnsp.ekstern-test.nspop.dk:8080/ddsregistry}
      XDS_REPOSITORY_URL: ${XDS_REPOSITORY_URL:-http://test1-cnsp.ekstern-test.nspop.dk:8080/ddsrepository}
      # Optional TEST2 overrides; unset values use application.properties defaults.
      XDS_TEST2_STS_URL:
      XDS_TEST2_REGISTRY_URL:
      XDS_TEST2_REPOSITORY_URL:
      XDS_SFSK_TEST1_REGISTRY_URL:
      XDS_SFSK_TEST1_REPOSITORY_URL:
      XDS_SFSK_TEST2_REGISTRY_URL:
      XDS_SFSK_TEST2_REPOSITORY_URL:
      # Match the MedCom test default in xds-service/application.properties.
      XDS_HSUID_ORGANISATION_IDENTIFIER: ${XDS_HSUID_ORGANISATION_IDENTIFIER:-325431000016004}
      XDS_HSUID_ORGANISATION_SCHEME: ${XDS_HSUID_ORGANISATION_SCHEME:-sor}
      XDS_ROLE: ${XDS_ROLE:-Læge}
      XDS_AUTHORIZATION_CODE: ${XDS_AUTHORIZATION_CODE:-}
      XDS_TIMEOUT_SECONDS: ${XDS_TIMEOUT_SECONDS:-45}
      XDS_VAULT_PASSWORD: ${XDS_VAULT_PASSWORD:-}
      ALLOW_TEST1_LEGACY_SHA1: "${XDS_ALLOW_TEST1_LEGACY_SHA1:-true}"
    volumes:
      - ./xds-service/local:/local:ro
      - ./xds-service/application.properties:/app/config/application.properties:ro
    networks:
      default:
        aliases: [xds-connector]
    healthcheck:
      test: [CMD, java, -cp, /app/probe, com.trifork.ihexdsapi.gitb.ReadinessProbe]
      interval: 5s
      timeout: 10s
      retries: 30
