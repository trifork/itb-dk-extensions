# Add after docker-compose.yml and (for published images) compose.published.yml.
# Requires Docker Compose 2.24.4+ for !override.
volumes:
  caddy-data:
  caddy-config:

services:
  https-proxy:
    image: docker.io/library/caddy:2.11.4-alpine@sha256:de23def33b17fb5d1290b0f6c2add1d70780e52341896c00a4c8a2a2fe9d355e
    restart: unless-stopped
    environment:
      ITB_HTTPS_HOST: ${ITB_HTTPS_HOST:?Set ITB_HTTPS_HOST to the public DNS hostname}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
      - "8443:8443"
    volumes:
      - ./get-up-and-running/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      gitb-ui-gateway:
        condition: service_started
      gitb-srv:
        condition: service_started
      cda-validator:
        condition: service_started

  gitb-ui:
    environment:
      TESTBED_HOME_LINK: https://${ITB_HTTPS_HOST}
      AUTHENTICATION_COOKIE_PATH: /

  gitb-ui-gateway:
    # Keep local bootstrap access without a public plaintext bypass.
    ports: !override
      - "127.0.0.1:9000:9000"

  gitb-srv:
    environment:
      CALLBACK_ROOT_URL: https://${ITB_HTTPS_HOST}/itbsrv
    ports: !override
      - "127.0.0.1:8080:8080"

  cda-validator:
    environment:
      SERVER_FORWARD_HEADERS_STRATEGY: framework
    ports: !override
      - "127.0.0.1:8091:8080"
