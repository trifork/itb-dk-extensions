# ITB XML validator domain configuration for Danish HL7 CDA profiles (MedCom).
#
# This domain is loaded by the isaitb/xml-validator image when this folder is
# placed under the validator's resource root (see repository README.md).
# Reference documentation: https://www.itb.ec.europa.eu/docs/guides/latest/validatingXML/

# Expose the web upload form, the REST API and the GITB SOAP validation API.
validator.channels = form, rest_api, soap_api

# Supported upstream upload-page extension; the implementation lives in the thin preview JAR.
validator.javascriptExtension = $(function(){var s=document.createElement('script');s.src='preview.js';document.head.appendChild(s);});

# One type per CDA profile, with explicit version/ruleset options.
# Options identify published Danish profile releases; coverage is recorded in rulesets.json.
validator.type = apd, cpd, pdc, phmr, qrd, qfdd, phad, pmr, prf, pscr

validator.typeLabel.apd  = APD-DK - Appointment Document
validator.typeLabel.cpd  = CPD-DK - Care Plan Document
validator.typeLabel.pdc  = PDC-DK - Personal Data Card
validator.typeLabel.phmr = PHMR-DK - Personal Healthcare Monitoring Report
validator.typeLabel.qrd  = QRD-DK - Questionnaire Response Document
validator.typeLabel.qfdd = QFDD-DK - Questionnaire Form Definition Document

# Explicit Danish profile versions. Unversioned and dated selections are not aliases.
validator.typeOptions.apd = v2.0.1
validator.typeOptionLabel.apd.v2.0.1 = 2.0.1
validator.completeTypeOptionLabel.apd.v2.0.1 = APD-DK 2.0.1
validator.schemaFile.apd.v2.0.1 = xsd/CDA_SDTC.xsd
validator.schematronFile.apd.v2.0.1 = sch/apd, sch/versions/apd-v2.0.1.sch, sch/versions/apd-v2.0.1-conformance.sch

validator.typeOptions.cpd = v2.0.0
validator.typeOptionLabel.cpd.v2.0.0 = 2.0.0
validator.completeTypeOptionLabel.cpd.v2.0.0 = CPD-DK 2.0.0
validator.schemaFile.cpd.v2.0.0 = xsd/CDA_SDTC.xsd
validator.schematronFile.cpd.v2.0.0 = sch/cpd, sch/versions/cpd-v2.0.0.sch, sch/versions/cpd-v2.0.0-conformance.sch

validator.typeOptions.pdc = v2.0, v3.0.0
validator.typeOptionLabel.pdc.v2.0 = 2.0
validator.completeTypeOptionLabel.pdc.v2.0 = PDC-DK 2.0
validator.schemaFile.pdc.v2.0 = xsd/CDA_SDTC.xsd
validator.schematronFile.pdc.v2.0 = sch/pdc, sch/versions/pdc-v2.0.sch, sch/versions/pdc-v2.0-conformance.sch
validator.typeOptionLabel.pdc.v3.0.0 = 3.0.0
validator.completeTypeOptionLabel.pdc.v3.0.0 = PDC-DK 3.0.0
validator.schemaFile.pdc.v3.0.0 = xsd/CDA_SDTC.xsd
validator.schematronFile.pdc.v3.0.0 = sch/pdc, sch/versions/pdc-v3.0.0.sch, sch/versions/pdc-v3.0.0-conformance.sch

validator.typeOptions.phmr = v2.1.0, v1.3
validator.typeOptionLabel.phmr.v1.3 = 1.3
validator.completeTypeOptionLabel.phmr.v1.3 = PHMR-DK 1.3
validator.schemaFile.phmr.v1.3 = xsd/CDA_SDTC.xsd
validator.schematronFile.phmr.v1.3 = sch/phmr, sch/versions/phmr-v1.3.sch, sch/versions/phmr-v1.3-conformance.sch
validator.typeOptionLabel.phmr.v2.1.0 = 2.1.0
validator.completeTypeOptionLabel.phmr.v2.1.0 = PHMR-DK 2.1.0
validator.schemaFile.phmr.v2.1.0 = xsd/CDA_SDTC.xsd
validator.schematronFile.phmr.v2.1.0 = sch/phmr, sch/versions/phmr-v2.1.0.sch, sch/versions/phmr-v2.1.0-conformance.sch

validator.typeOptions.qrd = v1.3.2
validator.typeOptionLabel.qrd.v1.3.2 = 1.3.2
validator.completeTypeOptionLabel.qrd.v1.3.2 = QRD-DK 1.3.2
validator.schemaFile.qrd.v1.3.2 = xsd/CDA_SDTC.xsd
validator.schematronFile.qrd.v1.3.2 = sch/qrd, sch/versions/qrd-v1.3.2.sch, sch/versions/qrd-v1.3.2-conformance.sch

validator.typeOptions.qfdd = v1.2
validator.typeOptionLabel.qfdd.v1.2 = 1.2
validator.completeTypeOptionLabel.qfdd.v1.2 = QFDD-DK 1.2
validator.schemaFile.qfdd.v1.2 = xsd/CDA_SDTC.xsd
validator.schematronFile.qfdd.v1.2 = sch/qfdd, sch/versions/qfdd-v1.2.sch, sch/versions/qfdd-v1.2-conformance.sch

# Gazelle ObjectsChecker plugin (see cda-validator/src/): reproduces the
# model-based validation cda.medcom.dk runs in addition to the schematrons, plus the
# hardcoded PHMR-DK checks (CONF-PHMR-DK-1/4/5). Applies to all validation types;
# the plugin selects the engine from the validationType input.
validator.defaultPlugins.0.jar   = plugins/validator-plugin-cda-dk.jar
validator.defaultPlugins.0.class = com.trifork.itb.plugin.CdaDkGazellePlugin

# Match cda.medcom.dk behaviour: run schematrons/plugins even when XSD validation fails
# (by default the ITB validator stops after XSD errors).
validator.stopOnXsdErrors = false

# Web UI texts.
validator.uploadTitle = Danish HL7 CDA validator (MedCom profiles)
validator.reportTitle = Validation report

validator.typeLabel.phad = PHAD-DK - Personal Health Attachment Document
validator.typeOptions.phad = v1.0.1
validator.typeOptionLabel.phad.v1.0.1 = 1.0.1
validator.completeTypeOptionLabel.phad.v1.0.1 = PHAD-DK 1.0.1
validator.schemaFile.phad.v1.0.1 = xsd/CDA_SDTC.xsd
validator.schematronFile.phad.v1.0.1 = sch/versions/phad-v1.0.1.sch, sch/versions/phad-v1.0.1-conformance.sch

