validator.schematronFile.pmr.v2.0.0 = sch/versions/pmr-v2.0.0.sch, sch/versions/pmr-v2.0.0-conformance.sch

validator.typeLabel.prf = PRF-DK - Pregnancy Referral Form
validator.typeOptions.prf = v3.0.0
validator.typeOptionLabel.prf.v3.0.0 = 3.0.0
