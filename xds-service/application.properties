# Required when loading signing identities; may also be set in /local/application.properties.
xds.vault.password=${XDS_VAULT_PASSWORD:}

# Named registries offered by the ITB selector. Each has its own STS, search and retrieval endpoints.
# TEST1 retains the existing settings and environment/local overrides.
STSURL=${XDS_STS_URL:http://test1.ekstern-test.nspop.dk:8080/sts/services/NewSecurityTokenService}
xdsIti18Endpoint=${XDS_REGISTRY_URL:http://test1-cnsp.ekstern-test.nspop.dk:8080/ddsregistry}
xdsIti43Endpoint=${XDS_REPOSITORY_URL:http://test1-cnsp.ekstern-test.nspop.dk:8080/ddsrepository}

xds.registries[0].id=test1
xds.registries[0].name=DDS TEST1
xds.registries[0].sts-endpoint=${STSURL}
xds.registries[0].iti18-endpoint=${xdsIti18Endpoint}
xds.registries[0].iti43-endpoint=${xdsIti43Endpoint}

# Published external TEST2 addresses. Access depends on STS trust and DDS authorisation.
# https://www.nspop.dk/spaces/Web3/pages/4839407/Endpoints%2Bfor%2Beksterne%2Btestmilj%C3%B8er
xds.registries[1].id=test2
xds.registries[1].name=DDS TEST2
xds.registries[1].sts-endpoint=${XDS_TEST2_STS_URL:https://test2.ekstern-test.nspop.dk:8443/sts/services/NewSecurityTokenService}
xds.registries[1].iti18-endpoint=${XDS_TEST2_REGISTRY_URL:https://test2-cnsp.ekstern-test.nspop.dk:8443/ddsregistry}
xds.registries[1].iti43-endpoint=${XDS_TEST2_REPOSITORY_URL:https://test2-cnsp.ekstern-test.nspop.dk:8443/ddsrepository}

# Override the complete registry list in /local/application.properties; see docs/xds.md.
CORS_ALLOWED_ORIGINS=http://localhost:9000
# Read-only search lists shared by TEST1 and TEST2. Override in /local/application.properties.
# MedCom XDS metadata 1.0.1 (published 2025-05-08), IHE TypeCode and DK IHE FormatCode.
# https://medcomfhir.dk/ig/xdsmetadata/ValueSet-MedCom-ihe-core-typecode-VS.html
type.code.scheme=2.16.840.1.113883.6.1
type.code.codes=53576-5;74468-0;74465-6;11502-2;56446-8;39289-4;39290-2;103140-0;11450-4;81215-6;57059-8;28615-3;CMR;PDC;MADC;PFR;PSCR;PMR
type.code.names=Personal health monitoring report;Questionnaire Form Definition Document;Questionnaire Response Document;Laboratory report;Appointment Summary Document;Follow-up (referred to) provider /specialist, appointment date CPHS;Follow-up (referred to) program, appointment date CPHS;Personal health attachment Document;Problem list - Reported;Care plan - recommended C-CDA R2.0 & R2.1 sections;Pregnancy visit summary note Narrative;Audiology Study;Clinical Mesurement Report;Stamkort;MADC;Pregnancy Referral Form;Pregnancy Shared Care Report;Pregnancy Measurement Report
# MedCom document types use their own scheme; other types retain the LOINC default.
type.code.scheme-overrides[CMR]=1.2.208.184.100.1
type.code.scheme-overrides[PDC]=1.2.208.184.100.1
type.code.scheme-overrides[MADC]=1.2.208.184.100.1
type.code.scheme-overrides[PFR]=1.2.208.184.100.1
type.code.scheme-overrides[PSCR]=1.2.208.184.100.1
type.code.scheme-overrides[PMR]=1.2.208.184.100.1
format.code.scheme=1.2.208.184.100.10
# Published MedCom metadata formats, legacy PHMR, and PHMR 2.1 observed in TEST1 metadata.
# https://medcomfhir.dk/ig/xdsmetadata/CodeSystem-MedCom-ihe-formatcode-CS.html
format.code.codes=urn:ad:dk:medcom:phmr:full;urn:ad:dk:medcom:phmr-v1.3:full;urn:ad:dk:medcom:phmr-v2.1:full;urn:ad:dk:medcom:qfdd-v1.1:full;urn:ad:dk:medcom:qfdd-v1.2:full;urn:ad:dk:medcom:qrd-v1.1:full;urn:ad:dk:medcom:qrd-v1.2:full;urn:ad:dk:medcom:qrd-v1.3:full;urn:ad:dk:medcom:apd-v2.0.1:full;urn:ad:dk:medcom:appointmentsummary:full;urn:ad:dk:medcom:cmr-v1.0:full;urn:ad:dk:medcom:cpd-v1.0.1:full;urn:ad:dk:medcom:sds:cpd-v1.0.1:maternity;urn:ad:dk:medcom:labreports:svareksponeringsservice;urn:ad:dk:medcom:pdc-v2.0:full;urn:ad:dk:medcom:prvs-v1.0:full;urn:ad:dk:medcom:pdc-v3.0:full;urn:ad:dk:medcom:cpd-v2.0:full;urn:ad:dk:medcom:phad-v1.0:full;urn:ad:dk:medcom:plr-v1.0:full;urn:ad:dk:medcom:nauf-v500:full;urn:ad:dk:medcom:nauf-v502:full;urn:ad:dk:medcom:nimf-v500:full;urn:ad:dk:medcom:nadf-v501:full;urn:ad:dk:medcom:nhisf-v500:full;urn:ad:dk:medcom:prf-v1.0:full;urn:ad:dk:medcom:pscr-v1.0:full;urn:ad:dk:medcom:pmr-v1.0:full
format.code.names=PHMR legacy unversioned format;PHMR 1.3 format;PHMR 2.1 format;QFDD 1.1 format;QFDD 1.2 format;QRD 1.1 format;QRD 1.2 format;QRD 1.3 format;APD 2.0.1 format;DK Appointment Summary Document schema;CMR 1.0 format;CPD 1.0.1 format;DK CPD schema for maternity;Laboratoriesvar (samling af svar);PDC 2.0 format;PRVS 1.0 format;PDC 3.0 format;CPD 2.0 format;PHAD 1.0 format;PLR 1.0 format;NAUF 500 format;NAUF 502 format;NIMF 500 format;NADF 501 format;NHISF 500 format;PRF 1.0 format;PSCR 1.0 format;PMR 1.0 format
# Unused registration code lists are intentionally empty.
event.code.scheme=
event.code.scheme.codes=
event.code.scheme.names=
healthcarefacilitytype.code.scheme=
healthcarefacilitytype.code.codes=
healthcarefacilitytype.code.names=
practicesetting.code.scheme=
practicesetting.code.codes=
