name: Publish XDS service

on:
  workflow_dispatch:
  push:
    tags: ['xds-v*']

permissions:
  contents: read
  packages: read

jobs:
  verify:
    uses: ./.github/workflows/xds-integration.yml
  publish:
    needs: verify
    if: github.ref_type == 'tag' || github.ref_name == github.event.repository.default_branch
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      REPOSITORY: ${{ github.repository }}
      REVISION: ${{ github.sha }}
      REF_TYPE: ${{ github.ref_type }}
      REF_NAME: ${{ github.ref_name }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      DOCKERHUB_NAMESPACE: trifork
      OIDC_CONNECTION_ID: ${{ vars.DOCKERHUB_OIDC_CONNECTIONID }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Select validated release tags
        id: release
        run: |
          if [[ -z "$OIDC_CONNECTION_ID" ]]; then
            printf 'Set the DOCKERHUB_OIDC_CONNECTIONID Actions variable.\n' >&2
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "$REVISION"
          git merge-base --is-ancestor "$REVISION" "origin/$DEFAULT_BRANCH"
          if [[ ! "$DOCKERHUB_NAMESPACE" =~ ^[a-z0-9][a-z0-9_-]*$ ]]; then
            printf 'Invalid Docker Hub namespace.\n' >&2
            exit 1
          fi
          repository=$(printf '%s' "${REPOSITORY##*/}" | tr '[:upper:]' '[:lower:]')
          image="docker.io/$DOCKERHUB_NAMESPACE/$repository-xds"
          tags="$image:sha-$REVISION"
          if [[ "$REF_TYPE" == tag ]]; then
            version="${REF_NAME#xds-v}"
            if [[ ! "$version" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]; then
              printf 'Invalid XDS release tag.\n' >&2
              exit 1
            fi
            if [[ "$version" == latest || "$version" == sha-* ]]; then
              printf 'Release tags cannot replace latest or commit tags.\n' >&2
              exit 1
            fi
            tags="$tags,$image:$version"
          fi
          printf 'tags=%s\n' "$tags" >> "$GITHUB_OUTPUT"
      - name: Authenticate to Docker Hub
        uses: docker/login-action@v4.5.0
        with:
          username: trifork
        env:
          DOCKERHUB_OIDC_CONNECTIONID: ${{ vars.DOCKERHUB_OIDC_CONNECTIONID }}
          # The default five-minute token is shorter than these multi-platform builds.
          DOCKERHUB_OIDC_EXPIREIN: 3600
      - name: Build, verify and publish production image
        uses: docker/build-push-action@v7
        with:
          context: xds-service
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.release.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: mode=max
          sbom: true
