name: Check XML validator releases

on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-xml-validator
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      changed: ${{ steps.release.outputs.changed }}
      image: ${{ steps.release.outputs.image }}
      source_ref: ${{ steps.pr.outputs.pull-request-head-sha }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'

      - name: Check updater logic
        run: python3 tests/test_validator_image.py

      - name: Check Docker Hub and update the Compose pin
        id: release
        run: python3 scripts/validator_image.py --update --github-output "$GITHUB_OUTPUT"

      - name: Open or update the release PR
        id: pr
        if: steps.release.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8.1.1
        with:
          token: ${{ github.token }}
          branch: automation/xml-validator-release
          base: ${{ github.event.repository.default_branch }}
          add-paths: docker-compose.yml
          commit-message: 'Update XML validator to ${{ steps.release.outputs.version }}'
          title: 'Update isaitb/xml-validator to ${{ steps.release.outputs.version }}'
          body: |
            Docker Hub has published a newer stable XML validator release.

            Previous image: `${{ steps.release.outputs.old_image }}`
            Proposed image: `${{ steps.release.outputs.image }}`

            Compose and CI share this version-and-digest base-image pin. The CDA image compiles the plugin from source on top of it. Merging updates the base used on the next build.

            [Published tags](https://hub.docker.com/r/isaitb/xml-validator/tags)
            [Validation results for this candidate](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})

            The validation job in the linked run checks out this PR's exact head commit, builds the CDA image on the proposed base, and runs the container tests. Review its result before merging; this PR is not merged automatically.

      - name: Verify the PR revision is available for validation
        if: steps.release.outputs.changed == 'true'
        env:
          PR_HEAD_SHA: ${{ steps.pr.outputs.pull-request-head-sha }}
        run: test -n "$PR_HEAD_SHA"

      - name: Summarize the release check
        env:
          UPDATE_AVAILABLE: ${{ steps.release.outputs.changed }}
          PINNED_IMAGE: ${{ steps.release.outputs.old_image }}
          PROPOSED_IMAGE: ${{ steps.release.outputs.image }}
          PR_URL: ${{ steps.pr.outputs.pull-request-url }}
        run: |
          {
            printf '## XML validator release check\n\nCurrent pin: `%s`\n\n' "$PINNED_IMAGE"
            if [[ "$UPDATE_AVAILABLE" == true ]]; then
              printf 'New release: `%s`\n\n[Review the update PR](%s)\n\nCandidate validation results appear in the validation job summary.\n' "$PROPOSED_IMAGE" "$PR_URL"
            else
              printf '✅ Already on the newest stable release. No update PR needed.\n'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # GITHUB_TOKEN-created PRs do not trigger pull_request workflows. Call the
  # validation workflow explicitly so every proposed update is tested anyway.
  validate-candidate:
    needs: update
    if: needs.update.outputs.changed == 'true'
    uses: ./.github/workflows/validate-cda.yml
    with:
      validator_image: ${{ needs.update.outputs.image }}
      source_ref: ${{ needs.update.outputs.source_ref }}
    permissions:
      contents: read
